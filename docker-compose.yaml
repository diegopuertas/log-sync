services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8081:8080"
    networks:
      - network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "8082:8080"
    networks:
      - network

networks:
  network:
    driver: bridge
