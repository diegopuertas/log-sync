services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    init: true
    container_name: server
    ports:
      - "8081:8080"
    volumes:
      - ./backups:/backup
    env_file:
      - environment

  client:
    depends_on:
      - server
    build:
      context: ./client
      dockerfile: Dockerfile
    init: true
    container_name: client
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    ports:
      - "8082:8080"
    volumes:
      - ./logs:/log
    env_file:
      - environment